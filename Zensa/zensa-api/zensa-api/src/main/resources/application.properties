server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/zensa_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT — this secret is for LOCAL DEVELOPMENT ONLY.
# It must be at least 32 characters for HS256.
# In production this is set as an environment variable, never committed.
zensa.jwt.secret=ZensaLocalDevSecretKeyChangeBeforeDeploying1234567890
zensa.jwt.expiration-ms=86400000
